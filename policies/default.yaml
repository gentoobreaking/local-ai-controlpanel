# Agent Control Plane 預設政策（spec §10 / §30）
# T010 起由 Policy Engine 載入；Phase 1–5 強制 local_only。

version: "2"

execution:
  strategy: local_first
  local:
    worker: pi-local
    model: qwen2.5-coder:7b
    max_attempts: 3
  allow_cloud: false            # Phase 1–5 硬性禁止（§24）

research:
  enabled: true
  required_when:
    - unknown_dependency
    - version_sensitive
    - external_api
    - unfamiliar_framework
    - security_sensitive
    - low_confidence
  minimum_sources: 2
  official_source_preferred: true
  max_rounds: 3
  retrievers:
    repository: true
    documentation: true
    git_history: true
    web: true
  # §14.2 降級政策：research 重試耗盡後的行為
  # allow_local 僅適用低/中風險 + 本地證據足夠；high risk 一律 block（§14.2 鐵律）
  research_failure:
    on_partial: allow_local
    on_failed: ask_user        # 完全失敗 → 問使用者（不擅自降級）
    max_retries: 2             # §14.4 卡死防護：重試 ×2 後才降級判定
    retry_backoff_seconds: [5, 30]

evidence:
  max_tokens: 8000
  min_relevance: 0.3
  budget_percent: 0.4

artifact:
  allowed:
    - "src/**"
    - "lib/**"
  readonly:
    # 測試為驗收基準：模型不得更動（防「改斷言讓測試變綠」）
    - "tests/**"
    - "test/**"
    - "package-lock.json"
    - "go.mod"
    - "go.sum"
  forbidden:
    - ".git/**"
    - ".env"
    - "secrets/**"

verification:
  required:
    - unit_test
    - lint

retry:
  enabled: true
  max_attempts: 3
  on:
    coding_error: retry
    knowledge_error: research
    requirement_error: ask_user
    environment_error: repair
    tool_error: retry
    model_limitation: stop        # Phase 1–5 = STOP（§24）

permissions:
  filesystem:
    read: true
    write: policy-controlled
  shell:
    enabled: true
    sandbox: true
  git:
    read: true
    write: policy-controlled
  network:
    enabled: false               # 本地 Worker 預設禁止；僅 Research Engine 有網
